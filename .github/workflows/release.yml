name: Release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify tag matches package version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      package_version: ${{ steps.meta.outputs.package_version }}
      version_tag: ${{ steps.meta.outputs.version_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Read and validate version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [[ "${TAG_NAME}" == v* ]]; then
            TAG_VERSION="${TAG_NAME#v}"
          else
            TAG_VERSION="${TAG_NAME}"
          fi

          if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
            echo "Tag and package version mismatch."
            echo "Tag: ${TAG_NAME} -> ${TAG_VERSION}"
            echo "package.json version: ${PKG_VERSION}"
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "package_version=${PKG_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version_tag=v${PKG_VERSION}" >> "${GITHUB_OUTPUT}"

          echo "Release tag: ${TAG_NAME}"
          echo "Artifact version tag: v${PKG_VERSION}"

  verify-ci:
    name: Verify CI passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify-version

    steps:
      - name: Check CI status for tagged commit
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: "ci.yml",
              head_sha: sha,
              per_page: 100,
            });

            const completed = runs.filter((run) => run.status === "completed");
            const successful = completed.find((run) => run.conclusion === "success");

            if (!successful) {
              const summary = completed
                .slice(0, 5)
                .map((run) => `${run.id}:${run.conclusion}`)
                .join(", ");
              core.setFailed(
                `No successful CI run found for commit ${sha}. Completed CI runs: ${summary || "none"}`
              );
              return;
            }

            core.info(`Found successful CI run: ${successful.html_url}`);

  prepare-windows-portable-base:
    name: Prepare Windows portable base
    runs-on: windows-latest
    timeout-minutes: 120
    needs:
      - verify-version
      - verify-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build release base outputs
        run: pnpm run build:release-base

      - name: Prepare Windows portable base
        run: pnpm run pack:win:base -- --skip-build --force-repack

      - name: Validate Windows portable base
        shell: pwsh
        run: |
          $required = @(
            "artifacts/win/.Protocol-Bunker-base/app/VERSION",
            "artifacts/win/.Protocol-Bunker-base/app/BUILD_STAMP.json",
            "artifacts/win/.Protocol-Bunker-base/app/server/dist/index.js"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing expected base file: $file"
            }
          }

      - name: Upload Windows portable base
        uses: actions/upload-artifact@v6
        with:
          name: windows-portable-base
          include-hidden-files: true
          if-no-files-found: error
          path: artifacts/win/.Protocol-Bunker-base

  build-windows-portable:
    name: Build Windows portable ${{ matrix.variant }}
    runs-on: windows-latest
    timeout-minutes: 60
    needs:
      - verify-version
      - prepare-windows-portable-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: 1x
            base_dir: artifacts/win/.Protocol-Bunker-base
            release_name: release-windows-1x
            output_dir: artifacts/win/Protocol-Bunker

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Download Windows portable base
        uses: actions/download-artifact@v5
        with:
          name: windows-portable-base
          path: ${{ matrix.base_dir }}

      - name: Build Windows portable variant from base
        run: >
          node scripts/pack-win-portable.mjs
          --from-base
          --skip-build
          --force-repack
          --base-dir ${{ matrix.base_dir }}
          --asset-variant ${{ matrix.variant }}

      - name: Validate Windows portable variant artifact
        shell: pwsh
        run: |
          $v = "${{ needs.verify-version.outputs.version_tag }}"
          $zipName = "protocol-bunker-win-x64-portable-$v.zip"
          $zip = Join-Path "artifacts/win" $zipName
          if (-not (Test-Path -LiteralPath $zip)) {
            throw "Missing expected artifact: $zip"
          }

          $required = @(
            "${{ matrix.output_dir }}/app/assets/ASSET_VARIANT",
            "${{ matrix.output_dir }}/app/assets/decks/${{ matrix.variant }}",
            "${{ matrix.output_dir }}/app/client/dist/index.html",
            "${{ matrix.output_dir }}/app/server/dist/index.js"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing expected runtime file: $file"
            }
          }

          $assetVariant = (Get-Content -LiteralPath "${{ matrix.output_dir }}/app/assets/ASSET_VARIANT" -Raw).Trim()
          if ($assetVariant -ne "${{ matrix.variant }}") {
            throw "Unexpected asset variant marker: $assetVariant"
          }

      - name: Upload Windows portable release artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.release_name }}
          if-no-files-found: error
          path: artifacts/win/*.zip

  build-windows-desktop:
    name: Build Windows desktop artifacts
    runs-on: windows-latest
    timeout-minutes: 120
    needs:
      - verify-version
      - verify-ci
      - prepare-windows-portable-base

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Detect desktop packaging sources
        id: detect_desktop
        shell: pwsh
        run: |
          $required = @(
            "win-desktop/build.ps1",
            "win-desktop/build/pack-release.ps1"
          )
          $missing = @()
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) {
              $missing += $file
            }
          }

          if ($missing.Count -eq 0) {
            "available=true" >> $env:GITHUB_OUTPUT
            Write-Host "[release] desktop packaging sources found."
          } else {
            "available=false" >> $env:GITHUB_OUTPUT
            Write-Host "[release] desktop packaging sources are incomplete in this repository snapshot. Skipping pack:desktop."
            Write-Host "[release] Missing files:"
            $missing | ForEach-Object { Write-Host " - $_" }
          }

      - name: Download Windows portable base
        if: steps.detect_desktop.outputs.available == 'true'
        uses: actions/download-artifact@v5
        with:
          name: windows-portable-base
          path: artifacts/win/.Protocol-Bunker-base

      - name: Pack Windows desktop
        if: steps.detect_desktop.outputs.available == 'true'
        shell: pwsh
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File win-desktop/build.ps1
          -SkipBuild
          -ForceRepack
          -PortableBaseDir artifacts/win/.Protocol-Bunker-base
          -AssetVariant 1x

      - name: Validate Windows desktop artifacts
        if: steps.detect_desktop.outputs.available == 'true'
        shell: pwsh
        run: |
          Get-ChildItem artifacts/win-desktop -ErrorAction SilentlyContinue | Format-Table -AutoSize

          $v = "${{ needs.verify-version.outputs.version_tag }}"
          $expected = @(
            "artifacts/win-desktop/protocol-bunker-win-x64-desktop-$v.zip",
            "artifacts/win-desktop/protocol-bunker-win-x64-desktop-setup-$v.exe"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing expected artifact: $file"
            }
          }

          $runtimeRequired = @(
            "artifacts/win-desktop/Protocol-Bunker/ProtocolBunker.exe",
            "artifacts/win-desktop/Protocol-Bunker/UpdaterHelper.exe",
            "artifacts/win-desktop/Protocol-Bunker/Localization/desktop.ru.json",
            "artifacts/win-desktop/Protocol-Bunker/Localization/desktop.en.json",
            "artifacts/win-desktop/Protocol-Bunker/app/assets/ASSET_VARIANT",
            "artifacts/win-desktop/Protocol-Bunker/app/assets/decks/1x",
            "artifacts/win-desktop/Protocol-Bunker/app/client/dist/index.html",
            "artifacts/win-desktop/Protocol-Bunker/app/server/dist/index.js",
            "artifacts/win-desktop/Protocol-Bunker/app/VERSION",
            "artifacts/win-desktop/Protocol-Bunker/app/portable.env"
          )
          foreach ($file in $runtimeRequired) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing expected desktop runtime file: $file"
            }
          }

          $asciiDir = "artifacts/win-desktop/Protocol-Bunker/AsciiAnimations"
          if (-not (Test-Path -LiteralPath $asciiDir)) {
            throw "Missing expected desktop runtime directory: $asciiDir"
          }

          $asciiFiles = Get-ChildItem -LiteralPath $asciiDir -File -ErrorAction Stop
          if ($asciiFiles.Count -lt 1) {
            throw "AsciiAnimations directory is empty: $asciiDir"
          }

          $assetVariant = (Get-Content -LiteralPath "artifacts/win-desktop/Protocol-Bunker/app/assets/ASSET_VARIANT" -Raw).Trim()
          if ($assetVariant -ne "1x") {
            throw "Unexpected EXE asset variant marker: $assetVariant"
          }

      - name: Upload Windows desktop release assets
        if: steps.detect_desktop.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-desktop
          if-no-files-found: error
          path: |
            artifacts/win-desktop/protocol-bunker-win-x64-desktop-${{ needs.verify-version.outputs.version_tag }}.zip
            artifacts/win-desktop/protocol-bunker-win-x64-desktop-setup-${{ needs.verify-version.outputs.version_tag }}.exe

  prepare-linux-base-x64:
    name: Prepare Linux x64 base
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - verify-version
      - verify-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release base outputs
        run: pnpm run build:release-base

      - name: Prepare Linux x64 base
        run: pnpm run pack:linux:base -- --skip-build --force-repack

      - name: Validate Linux x64 base
        shell: bash
        run: |
          set -euo pipefail
          test -f "artifacts/linux/.Protocol-Bunker-base/app/VERSION"
          test -f "artifacts/linux/.Protocol-Bunker-base/app/BUILD_STAMP.json"
          test -f "artifacts/linux/.Protocol-Bunker-base/app/server/dist/index.js"

      - name: Upload Linux x64 base
        uses: actions/upload-artifact@v6
        with:
          name: linux-base-x64
          if-no-files-found: error
          include-hidden-files: true
          path: artifacts/linux/.Protocol-Bunker-base

  prepare-linux-base-arm64:
    name: Prepare Linux arm64 base
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - verify-version
      - verify-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release base outputs
        run: pnpm run build:release-base

      - name: Prepare Linux arm64 base
        run: pnpm run pack:linux:base:arm64 -- --skip-build --force-repack

      - name: Validate Linux arm64 base
        shell: bash
        run: |
          set -euo pipefail
          test -f "artifacts/linux/.Protocol-Bunker-arm64-base/app/VERSION"
          test -f "artifacts/linux/.Protocol-Bunker-arm64-base/app/BUILD_STAMP.json"
          test -f "artifacts/linux/.Protocol-Bunker-arm64-base/app/server/dist/index.js"

      - name: Upload Linux arm64 base
        uses: actions/upload-artifact@v6
        with:
          name: linux-base-arm64
          if-no-files-found: error
          include-hidden-files: true
          path: artifacts/linux/.Protocol-Bunker-arm64-base

  build-linux-variants:
    name: Build Linux ${{ matrix.arch }} ${{ matrix.profile }} ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - verify-version
      - prepare-linux-base-x64
      - prepare-linux-base-arm64
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            base_artifact: linux-base-x64
            base_dir: artifacts/linux/.Protocol-Bunker-base
            profile: public
            variant: 1x
            release_name: release-linux-x64-public-1x
            output_dir: artifacts/linux/Protocol-Bunker
          - arch: x64
            base_artifact: linux-base-x64
            base_dir: artifacts/linux/.Protocol-Bunker-base
            profile: server
            variant: 1x
            release_name: release-linux-x64-server-1x
            output_dir: artifacts/linux/Protocol-Bunker-server
          - arch: arm64
            base_artifact: linux-base-arm64
            base_dir: artifacts/linux/.Protocol-Bunker-arm64-base
            profile: public
            variant: 1x
            release_name: release-linux-arm64-public-1x
            output_dir: artifacts/linux/Protocol-Bunker-arm64
          - arch: arm64
            base_artifact: linux-base-arm64
            base_dir: artifacts/linux/.Protocol-Bunker-arm64-base
            profile: server
            variant: 1x
            release_name: release-linux-arm64-server-1x
            output_dir: artifacts/linux/Protocol-Bunker-arm64-server

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Download Linux base
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.base_artifact }}
          path: ${{ matrix.base_dir }}

      - name: Build Linux variant from base
        run: >
          node scripts/pack-linux-portable.mjs
          --from-base
          --skip-build
          --force-repack
          --arch ${{ matrix.arch }}
          --profile ${{ matrix.profile }}
          --asset-variant ${{ matrix.variant }}
          --base-dir ${{ matrix.base_dir }}

      - name: Validate Linux variant artifact
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifacts/linux || true
          test "$(find artifacts/linux -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test -f "${{ matrix.output_dir }}/app/assets/ASSET_VARIANT"
          test -d "${{ matrix.output_dir }}/app/assets/decks/${{ matrix.variant }}"
          test -f "${{ matrix.output_dir }}/app/client/dist/index.html"
          test -f "${{ matrix.output_dir }}/app/server/dist/index.js"
          test "$(tr -d '\r\n' < "${{ matrix.output_dir }}/app/assets/ASSET_VARIANT")" = "${{ matrix.variant }}"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.release_name }}
          if-no-files-found: error
          path: artifacts/linux/*.tar.gz

  publish-release:
    name: Publish GitHub Release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - verify-version
      - build-windows-portable
      - build-windows-desktop
      - build-linux-variants
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: List release assets
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-version.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
